<!doctype html><meta charset="utf-8"><title>Drawings: views, dimensions, sheet, PDF</title><script type="module">
import {test,eq,ok,near,throws,run} from './harness.js';
import {createKernel} from '../src/kernel/client.js';
import {createDocument,makeFeature,addFeature} from '../src/doc/model.js';
import {makePart,addPart,updatePart,removePart} from '../src/doc/parts.js';
import {validateDocument} from '../src/doc/schema.js';
import {faceRefFrom} from '../src/doc/refs.js';
import {findRegions,profileRefFrom} from '../src/sketch/profiles.js';
import {sk,circle} from './fixtures/sketches.js';
import * as D from '../src/drawing/model.js';
import {composeSheet,measureOf,boundsOf} from '../src/drawing/layout.js';
import {createDrawings} from '../src/drawing/make.js';
import {sheetToPDF} from '../src/drawing/pdf.js';
import {sheetToSVG} from '../src/drawing/svg.js';
import {textWidth,writable,winAnsi} from '../src/drawing/font.js';
import * as Mat from '../src/core/mat.js';
const k=createKernel(),drawings=createDrawings(k);
const good=r=>{eq(r.status,'done');ok(!r.features.some(f=>f.status==='error'),()=>JSON.stringify(r.features));return r;};
const part=(d,data={})=>{const m=makePart(d,data);return [addPart(m.doc,m.part),m.part.id];};
const feat=(d,type,p,data={})=>{const m=makeFeature(d,type,{part:p,...data});return [addFeature(m.doc,m.feature),m.feature.id];};
const topOf=(b,z)=>b.mesh.faces.findIndex(f=>f.plane&&Math.abs(f.plane.n[2]-1)<1e-9&&Math.abs(f.plane.d-z)<1e-9);
/** A plate 60 x 40 x 10 (x -30..30, y -20..20, z 0..10) with a hole of 8 through it at (10, 5). */
async function plate(){
 let d=createDocument('Shelf'),p,b,s,c;[d,p]=part(d,{name:'Plate'});[d,b]=feat(d,'box',p,{size:[60,40,10]});
 const body=good(await k.rebuild(d)).bodies[0],hole=sk();circle(hole,10,5,4);
 [d,s]=feat(d,'sketch',p,{...hole,plane:{kind:'face',ref:faceRefFrom(body,topOf(body,10))}});
 [d,c]=feat(d,'extrude',p,{sketch:s,profiles:findRegions(d.features.find(f=>f.id===s)).map(profileRefFrom),operation:'cut',extent:{type:'oneSide',distance:'all'},flip:true});
 const build=good(await k.rebuild(d));return {d,p,build,body:{...build.bodies[0],matrix:Mat.IDENTITY}};
}
const faceBy=(b,n,dd)=>b.mesh.faces.findIndex(f=>f.plane&&Math.abs(f.plane.n[0]-n[0])+Math.abs(f.plane.n[1]-n[1])+Math.abs(f.plane.n[2]-n[2])<1e-9&&(dd===undefined||Math.abs(f.plane.d-dd)<1e-6));
const rim=(b,z)=>b.mesh.edges.findIndex(e=>e.circle&&e.closed&&Math.abs(e.circle.c[2]-z)<1e-6);
const holeFace=b=>b.mesh.faces.findIndex(f=>f.cyl);
const pk=(body,kind,index)=>({body,kind,index});

test('the directions of the views: x across, y up, n to the eye',()=>{
 near(D.axesOf('front').y,[0,0,1]);near(D.axesOf('right').y,[0,0,1]);near(D.axesOf('left').y,[0,0,1]);near(D.axesOf('back').y,[0,0,1]);
 near(D.axesOf('top').y,[0,1,0]);near(D.axesOf('bottom').y,[0,-1,0]);near(D.axesOf('iso').y,[-1/Math.sqrt(6),1/Math.sqrt(6),2/Math.sqrt(6)],1e-12);
 eq([1,0.5,0.2,2,5,1/3].map(D.scaleText),['1:1','1:2','1:5','2:1','5:1','1:3']);
});
test('a drawing in the project: made, changed, checked, taken off with its part',async()=>{
 const {d:d0,p}=await plate();let {doc,drawing}=D.addDrawing(d0,p);eq(drawing,{id:'d1',name:'Drawing 1',part:p,sheet:'A4',scale:1,views:[],dims:[]});eq(validateDocument(doc),[]);
 let v;({doc,view:v}=D.addView(doc,'d1','front',[100,120]));eq(v.id,'v2');
 doc=D.editDrawing(doc,'d1',{scale:0.5,sheet:'A3',name:'Plate drawing'});eq(D.drawingById(doc,'d1').scale,0.5);eq(validateDocument(doc),[]);
 doc=D.moveView(doc,'v2',[150,150]);eq(D.drawingById(doc,'d1').views[0].at,[150,150]);
 eq(validateDocument(D.editDrawing(doc,'d1',{sheet:'B5'})),['Plate drawing: the sheet is one of A4, A4 portrait, A3, A2, A1, A0.']);
 eq(validateDocument({...doc,drawings:[{...D.drawingById(doc,'d1'),views:[{id:'v2',look:'up',at:[0,0]}]}]}).length,1);
 eq(D.addDrawing(doc,p).drawing.name,'Drawing 1','the name of the first is taken by none now'); eq(D.addDrawing(D.editDrawing(doc,'d1',{name:'Drawing 1'}),p).drawing.name,'Drawing 2');
 eq(removePart(doc,p).drawings,[],'a drawing goes with its part');eq(D.removeItems(doc,'d1',['v2']).drawings[0].views,[]);
});
test('the views of a plate with a hole, from the kernel',async()=>{
 const {d,p}=await plate(),looks=Object.fromEntries(['front','top','right','iso'].map(l=>[l,D.LOOKS[l]]));
 const v=await k.views(d,{parts:[p],looks,hidden:['front','top','right']});
 near(boundsOf(v.front),[-30,0,30,10],1e-4,'front: 60 across, 10 up');near(boundsOf(v.top),[-30,-20,30,20],1e-4,'top: 60 by 40');near(boundsOf(v.right),[-20,0,20,10],1e-4,'right: 40 across');
 ok(v.front.hidden.length>=2,'the hole is hidden in the front view');eq(v.iso.hidden,[],'no hidden lines in the iso view');
 // the hole seen round from the top: one closed polyline 2π·4 long round (10, 5)
 const len=pl=>{let s=0;for(let i=2;i<pl.length;i+=2)s+=Math.hypot(pl[i]-pl[i-2],pl[i+1]-pl[i-1]);return s;};
 const round=v.top.visible.filter(pl=>{const b=boundsOf({visible:[pl]});return Math.abs(b[2]-b[0]-8)<0.05;});
 ok(round.length>=1,()=>'the rim of the hole: '+JSON.stringify(v.top.visible.map(pl=>[pl.length,boundsOf({visible:[pl]}).map(x=>+x.toFixed(2))])));near(round.map(len).reduce((a,b)=>a+b,0),2*Math.PI*4,0.05,'its length');
 const b=boundsOf({visible:round});near([(b[0]+b[2])/2,(b[1]+b[3])/2],[10,5],0.01);
});
test('what a dimension measures in a view, and what it refuses',async()=>{
 const {body}=await plate(),L=faceBy(body,[-1,0,0]),R=faceBy(body,[1,0,0]),T=faceBy(body,[0,0,1]),B=faceBy(body,[0,0,-1]);
 let g=measureOf({along:null},[pk(body,'face',L),pk(body,'face',R)],'front');eq([g.kind,g.dir,+g.value.toFixed(6)],['linear','horizontal',60]);
 g=measureOf({along:null},[pk(body,'face',T),pk(body,'face',B)],'front');eq([g.dir,+g.value.toFixed(6)],['vertical',10]);
 g=measureOf({along:null},[pk(body,'edge',rim(body,10))],'top');eq([g.kind,g.prefix,+g.value.toFixed(6)],['leader','Ø',8]);
 g=measureOf({along:null},[pk(body,'face',holeFace(body))],'front');eq([g.kind,g.prefix,g.dir,+g.value.toFixed(6)],['linear','Ø','horizontal',8],'a hole seen from its side: its diameter across');
 g=measureOf({along:null},[pk(body,'face',L),pk(body,'face',holeFace(body))],'top');eq([g.dir,+g.value.toFixed(6)],['horizontal',40],'from the left side to the centre of the hole');
 await throws(()=>measureOf({along:null},[pk(body,'face',L),pk(body,'face',R)],'right'),/does not lie flat in the right view/);
 await throws(()=>measureOf({along:null},[pk(body,'face',L),pk(body,'face',T)],'front'),/at 90° to each other/);
 await throws(()=>measureOf({along:null},[pk(body,'face',T)],'top'),/a size each way/);
 await throws(()=>measureOf({along:null},[pk(body,'edge',rim(body,10))],'iso'),/at a slant/);
 // two corners of the top face, diagonal: along gives the parts of it
 const corner=(x,y)=>body.mesh.edges.findIndex(e=>e.kind==='line'&&Math.abs(e.a[0]-x)<1e-6&&Math.abs(e.a[1]-y)<1e-6&&Math.abs(e.b[0]-x)<1e-6&&Math.abs(e.b[1]-y)<1e-6);
 const a=corner(-30,-20),c=corner(30,20);ok(a>=0&&c>=0);
 g=measureOf({along:null},[pk(body,'edge',a),pk(body,'edge',c)],'top');eq([g.dir,+g.value.toFixed(4)],['aligned',+Math.hypot(60,40).toFixed(4)]);
 g=measureOf({along:'vertical'},[pk(body,'edge',a),pk(body,'edge',c)],'top');eq([g.dir,+g.value.toFixed(6)],['vertical',40]);
});
test('the sheet: views at the scale, dimensions with their numbers, frame and title block',async()=>{
 const {d:d0,p,build,body}=await plate();let {doc}=D.addDrawing(d0,p);
 doc=D.editDrawing(doc,'d1',{scale:2});
 let f,t;({doc,view:f}=D.addView(doc,'d1','front',[120,150]));({doc,view:t}=D.addView(doc,'d1','top',[120,80]));
 const L=faceBy(body,[-1,0,0]),R=faceBy(body,[1,0,0]);
 doc=D.addDim(doc,'d1',{view:f.id,from:D.pickRefFrom(body,'face',L),to:D.pickRefFrom(body,'face',R)}).doc;
 doc=D.addDim(doc,'d1',{view:t.id,from:D.pickRefFrom(body,'edge',rim(body,10))}).doc;
 doc=D.addDim(doc,'d1',{view:t.id,from:D.pickRefFrom(body,'face',L),to:D.pickRefFrom(body,'face',L)}).doc;
 eq(validateDocument(doc),[]);
 const sheet=await drawings.sheet(doc,build,'d1');
 eq(sheet.size,[297,210]);near(sheet.views[0].box,[60,140,180,160],1e-3,'the front view, twice its size, round where it stands');near(sheet.views[1].box,[60,40,180,120],1e-3);
 eq(sheet.dims.map(x=>x.text??x.problem),['60','Ø8','Those two lie in one place: there is no distance between them to draw.']);
 const texts=sheet.items.filter(i=>i.t==='text').map(i=>i.text);
 for(const w of ['60','Ø8','Plate','Shelf','Drawing 1','2:1','A4','mm','CoreCAD'])ok(texts.includes(w),`"${w}" is on the sheet`);
 // the 60 is above the front view, between arrows at its two ends
 const sixty=sheet.items.find(i=>i.t==='text'&&i.text==='60');near([sheet.items.find(i=>i.t==='text'&&i.text==='60').x],[120],1e-6);ok(sixty.y>160+9&&sixty.y<160+13,'above the view');
 ok(sheet.items.filter(i=>i.fill).length>=3,'arrow heads');
 ok(sheet.items.some(i=>i.dash&&i.dash.length===4),'centre lines');ok(sheet.items.some(i=>i.dash&&i.dash.length===2),'hidden lines');
 // lost: what it measured is gone
 const lost=await drawings.sheet({...doc,drawings:doc.drawings.map(x=>({...x,dims:x.dims.map(m=>({...m,from:{...m.from,labels:['f99/x'],faces:[['f99/x'],['f99/y']]}}))}))},build,'d1');
 eq(lost.dims[0].problem,'What it measured is no longer in the model.');
 window.__sheet=sheet;
});
test('the sheet as a PDF at its true size, and as SVG',async()=>{
 const sheet=window.__sheet,pdf=sheetToPDF(sheet,{title:'Plate – Ø8',date:new Date(Date.UTC(2026,10,28,12,0,0))}),text=new TextDecoder('latin1').decode(pdf);
 ok(text.startsWith('%PDF-1.4\n')&&text.endsWith('%%EOF\n'));
 ok(text.includes('/MediaBox [0 0 841.89 595.276]'),'A4 landscape in points');ok(text.includes('/BaseFont /Helvetica /Encoding /WinAnsiEncoding'));
 // every object where the cross-reference table says it is
 const xref=+text.match(/startxref\n(\d+)/)[1];ok(text.slice(xref).startsWith('xref\n0 7\n'));
 const offs=[...text.slice(xref).matchAll(/^(\d{10}) 00000 n $/gm)].map(m=>+m[1]);eq(offs.length,6);offs.forEach((o,i)=>ok(text.slice(o).startsWith(`${i+1} 0 obj\n`),`object ${i+1}`));
 const len=+text.match(/\/Length (\d+)/)[1],start=text.indexOf('stream\n')+7;eq(text.slice(start+len,start+len+10),'\nendstream');
 ok(text.includes('<d838>'),'Ø8 in WinAnsi');ok(text.includes('(D:20261128120000Z)'));
 const svg=sheetToSVG(sheet),dom=new DOMParser().parseFromString(svg,'image/svg+xml');ok(!dom.querySelector('parsererror'),'well formed');
 eq(dom.documentElement.getAttribute('width'),'297mm');ok([...dom.querySelectorAll('text')].some(t=>t.textContent==='Ø8'));
 // and it can be drawn: as a picture
 const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await img.decode();ok(img.width>0);
});
test('the letters of the typeface',()=>{
 near(textWidth('Ø8',10),(778+556)/100,1e-9);eq(writable('⌀ 8 → x'),'Ø 8 ? x');eq(winAnsi('Ø°×'),[0xd8,0xb0,0xd7]);
});
run();
</script>
